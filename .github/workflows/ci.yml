name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

concurrency:
  group: hgctl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          set-safe-directory: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify formatting
        run: test -z "$(gofmt -l .)"
      - name: Test
        env:
          CGO_ENABLED: "0"
        run: go test ./...
      - name: Vet
        run: go vet ./...
      # The release stamps the version through ldflags, and Go
      # SILENTLY IGNORES an -X whose package path does not resolve. So a refactor
      # that moves Version to another package - and internal/config is where it
      # arguably belongs, next to the rest of the machine's identity - would ship
      # every build as the hardcoded default with CI fully green. The endpoint
      # would then compare that default against every release forever and either
      # never update or update on a loop.
      #
      # Asserting the path textually would only re-encode the same assumption, so
      # this builds with the release's exact flag and asks the binary what it is.
      - name: Version stamping actually reaches the binary
        env:
          CGO_ENABLED: "0"
          # The release job now lives in this same file, so mirror its flag from
          # here - the two cannot drift when they are twelve lines apart, and a
          # path that stops resolving is otherwise silent (Go ignores an -X it
          # cannot match, exit 0, and the binary keeps its built-in default).
          GITHUB_WORKFLOW_REF_FILE: .github/workflows/ci.yml
        run: |
          stamp="v0.0.0-ci-stamp-probe"
          # Anchored on a real module path: an unanchored match picks up the
          # placeholder in the comment above and then stamps nothing, which is
          # how this check first failed - correctly.
          ldflags="$(grep -oE '\-X github\.com/[^"]+\.Version=' "$GITHUB_WORKFLOW_REF_FILE" | head -1)"
          test -n "$ldflags" || { echo "no -X ...Version= flag found to mirror" >&2; exit 1; }
          go build -ldflags "-s -w ${ldflags}${stamp}" -o "$RUNNER_TEMP/hgctl_stamped" ./cmd/hgctl
          got="$("$RUNNER_TEMP/hgctl_stamped" version)"
          if [ "$got" != "$stamp" ]; then
            echo "version stamping is broken: binary reports '${got}', want '${stamp}'" >&2
            echo "the -X package path in the release job no longer resolves to the package holding Version" >&2
            exit 1
          fi
          echo "version stamping reaches the binary via: ${ldflags}"

      - name: Cross-build supported targets
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=darwin GOARCH=amd64 go build -o "$RUNNER_TEMP/hgctl_darwin_amd64" ./cmd/hgctl
          GOOS=darwin GOARCH=arm64 go build -o "$RUNNER_TEMP/hgctl_darwin_arm64" ./cmd/hgctl
          GOOS=linux GOARCH=amd64 go build -o "$RUNNER_TEMP/hgctl_linux_amd64" ./cmd/hgctl
          GOOS=linux GOARCH=arm64 go build -o "$RUNNER_TEMP/hgctl_linux_arm64" ./cmd/hgctl

  # Gated on test, and in the SAME workflow so it cannot be otherwise. Release
  # used to be its own `on: push` workflow, which meant it raced CI rather than
  # waiting for it: a commit whose tests failed still cut a release, and three
  # machines auto-update within the hour. Nothing reported that - both runs
  # appear in the list, one green and one red, and the red one looks like a
  # problem to fix rather than a release to pull.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          Y=$(date -u +%Y%m%d)
          H=$((10#$(date -u +%H))); Mn=$((10#$(date -u +%M))); Sc=$((10#$(date -u +%S)))
          SECS=$((H*3600+Mn*60+Sc))
          VERSION="v0.${Y}.${SECS}"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/x2x3studio/hgctl/internal/hgctl.Version=$VERSION" \
              -o "hgctl_${os}_${arch}" ./cmd/hgctl
          done
          sha256sum hgctl_darwin_amd64 hgctl_darwin_arm64 hgctl_linux_amd64 hgctl_linux_arm64 > checksums.txt
          api="https://api.github.com/repos/x2x3studio/hgctl"
          uploads="https://uploads.github.com/repos/x2x3studio/hgctl"
          body="{\"tag_name\":\"$VERSION\",\"target_commitish\":\"$GITHUB_SHA\",\"name\":\"$VERSION\",\"body\":\"automated build from main\"}"
          code=$(curl -sS -o release.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "$api/releases" -d "$body")
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "release create failed: HTTP $code"; cat release.json; exit 1
          fi
          if command -v jq >/dev/null 2>&1; then
            release_id=$(jq -r '.id' release.json)
          elif command -v python3 >/dev/null 2>&1; then
            release_id=$(python3 -c 'import json; print(json.load(open("release.json"))["id"])')
          else
            release_id=$(grep -m1 -oE '"id"[[:space:]]*:[[:space:]]*[0-9]+' release.json | grep -oE '[0-9]+' || true)
          fi
          if ! printf '%s' "$release_id" | grep -qE '^[0-9]+$'; then
            echo "could not parse release id"; cat release.json; exit 1
          fi
          echo "created release $VERSION (id $release_id)"
          for f in hgctl_darwin_amd64 hgctl_darwin_arm64 hgctl_linux_amd64 hgctl_linux_arm64 checksums.txt; do
            code=$(curl -sS -o upload.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$f" \
              "$uploads/releases/$release_id/assets?name=$f")
            if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
              echo "asset upload failed for $f: HTTP $code"; cat upload.json; exit 1
            fi
            echo "uploaded $f"
          done
          echo "published $VERSION with 5 assets"
